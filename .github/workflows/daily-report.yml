name: Daily report scheduler

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-report-scheduler
  cancel-in-progress: false

jobs:
  check-schedule:
    environment: Production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FRONTEND_BASE_URL: ${{ secrets.FRONTEND_BASE_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Read configured report time
        id: schedule
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$FRONTEND_BASE_URL" || -z "$CRON_SECRET" ]]; then
            echo "FRONTEND_BASE_URL and CRON_SECRET must be configured as repository secrets."
            exit 1
          fi

          base_url="${FRONTEND_BASE_URL%/}"
          response="$(curl --fail --silent --show-error --retry 2 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$base_url/api/cron/report-schedule")"
          report_time="$(python -c 'import json, sys; print(json.load(sys.stdin)["reportScheduleTime"])' <<< "$response")"
          if [[ ! "$report_time" =~ ^([01][0-9]|2[0-3]):[0-5][0-9]$ ]]; then
            echo "Invalid reportScheduleTime returned by Frontend: $report_time"
            exit 1
          fi
          echo "report_time=$report_time" >> "$GITHUB_OUTPUT"

      - name: Check the Nigeria-time delivery window
        id: window
        env:
          REPORT_TIME: ${{ steps.schedule.outputs.report_time }}
        shell: bash
        run: |
          set -euo pipefail
          if python - <<'PY'
          from datetime import datetime, timedelta
          import os
          from zoneinfo import ZoneInfo

          hour, minute = map(int, os.environ["REPORT_TIME"].split(":"))
          now = datetime.now(ZoneInfo("Africa/Lagos"))
          scheduled = now.replace(hour=hour, minute=minute, second=0, microsecond=0)
          if now < scheduled:
              scheduled -= timedelta(days=1)
          is_due = timedelta(0) <= now - scheduled < timedelta(minutes=10)
          print(f"Configured {hour:02d}:{minute:02d} WAT; current time {now:%H:%M} WAT")
          raise SystemExit(0 if is_due else 1)
          PY
          then
            echo "due=true" >> "$GITHUB_OUTPUT"
          else
            echo "due=false" >> "$GITHUB_OUTPUT"
            echo "Outside the 10-minute delivery window; skipping."
          fi

      - name: Send daily report
        if: steps.window.outputs.due == 'true'
        shell: bash
        run: |
          set -euo pipefail
          base_url="${FRONTEND_BASE_URL%/}"
          curl --fail --silent --show-error --retry 1 --retry-all-errors \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$base_url/api/cron/daily-report"
